name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Needs no origin/base-path env: a Worker owns its whole hostname, so both
      # are literals in nuxt.config.ts.
      - name: Build
        run: pnpm run build

      # Reads wrangler.jsonc at the repo root, which points `main` at
      # .output/server and `assets` at .output/public. Plain wrangler rather
      # than a marketplace action — it is already a devDependency, so this adds
      # no supply chain and no version to track.
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
