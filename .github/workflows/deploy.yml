name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Build the static site. Both values come from the repo's Pages settings
      # via configure-pages, so the custom domain is configured in one place:
      # with it set, base_path is "" (the site is served from the root) and
      # origin is https://comehomelovelb.williamchong.cloud. Without it they
      # fall back to "/come-home-love-lb" and the github.io origin.
      # NUXT_APP_BASE_URL needs the trailing slash Nuxt expects; NUXT_SITE_URL
      # is the *origin only* — nuxt-site-config joins it with app.baseURL to
      # build canonicals and sitemap entries, so repeating a path would double it.
      - name: Build
        run: pnpm run build
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          NUXT_SITE_URL: ${{ steps.pages.outputs.origin }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
